name: Verify remaining dataset contracts
on:
  push:
    branches: ["work/privacy-comparison-20261027"]
    paths: [".github/workflows/dataset-contracts.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch explicitly observed public modules
        shell: python
        run: |
          import datetime,hashlib,json,os,pathlib,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'dataset-contracts';out.mkdir()
          modules=['IHKE3306S01.88c16693.js','IHKE3306S02.48917477.js','IHKE3307S01.73c5913c.js','IHKE3307S02.d141e2ab.js','IHKE3308S01.8e1f92e5.js','IHKE3308S02.daccc485.js','IHKE3309S01.f158f613.js','IHKE3309S02.deb370e8.js','IHKE3408S02.a93b9a4e.js','IHKE3408S03.7a152af9.js']
          evidence=[]
          for name in modules:
              url='https://myhealthbank.nhi.gov.tw/IHKE3000/js/'+name;row={'url':url}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Healthbank public source review','Accept':'application/javascript'}),timeout=20) as response:
                      body=response.read(2097153);row['status']=response.status
                  if len(body)>2097152 or b'webpackJsonp' not in body:raise ValueError('unexpected source response')
                  (out/name).write_bytes(body);row['sha256']=hashlib.sha256(body).hexdigest()
              except Exception as exc:row['error']=str(exc)
              evidence.append(row)
          (out/'evidence.json').write_text(json.dumps({'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'modules':evidence},indent=2))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: healthbank-dataset-contracts
          path: ${{ runner.temp }}/dataset-contracts/*
          if-no-files-found: error
          retention-days: 1
