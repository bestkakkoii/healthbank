name: Linux release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [RELEASE_CANDIDATE]
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version for the downloadable build artifacts"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # Publishing candidate releases requires write access; checkout credentials are not persisted.
    env:
      CI: "true"
      GOTOOLCHAIN: local
      GOENV: "off"
      GOWORK: "off"
      GOROOT: ""
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      # Disposable CI-only credentials; no production or medical data is used.
      HEALTHBANK_TEST_MYSQL_DSN: healthbank_ci:healthbank-test-only@tcp(127.0.0.1:3306)/healthbank_test?parseTime=true
    services:
      mysql:
        image: mysql:26.10.0@sha256:f51c9c01c16b0eb5d81bb70ab7e7fcb3b96abc6a54114be3a94e8e569cae7815
        env:
          MYSQL_DATABASE: healthbank_test
          MYSQL_USER: healthbank_ci
          MYSQL_PASSWORD: healthbank-test-only
          MYSQL_ROOT_PASSWORD: healthbank-root-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=healthbank-root-test-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main, verified 2026-10-27
        with:
          persist-credentials: false
      - name: Resolve explicit main-branch release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat RELEASE_CANDIDATE)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "RELEASE_CANDIDATE must be an explicit SemVer prerelease" >&2
            exit 2
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # main, verified 2026-10-27
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build pinned upstream tools and React packages
        run: |
          bash scripts/bootstrap-upstream.sh
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/go/bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Require zero ESLint errors and warnings
        run: npm --prefix web run lint
      - name: Type-check and compile frontend
        run: npm --prefix web run build
      - name: Verify frontend data handling
        run: npm --prefix web test
      - name: Verify release provenance and publication guards
        run: |
          python3 -W error scripts/test_release.py
          python3 -W error scripts/test_publish_release.py
      - name: Check npm dependency advisories
        run: npm --prefix web audit --audit-level=low
      - name: Verify Go code
        run: |
          unformatted="$(.tools/go/bin/gofmt -l cmd internal)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          .tools/go/bin/go mod verify
          .tools/go/bin/go test -count=1 ./...
          .tools/go/bin/go test -count=1 -race ./...
          .tools/go/bin/go vet ./...
      - name: Require all Staticcheck analyses to pass
        run: .tools/bin/staticcheck -checks=all ./cmd/... ./internal/...
      - name: Check reachable Go dependency advisories
        # Development Go lacks a comparable standard-library semver; see DEPENDENCIES.md.
        run: .tools/bin/govulncheck ./...
      - name: Build Linux release archives and checksums
        id: package
        env:
          GO: ${{ github.workspace }}/.tools/go/bin/go
          COMMIT: ${{ github.sha }}
        run: |
          version="$(python3 scripts/release.py version "$RELEASE_VERSION")"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "archive_prefix=healthbank_${version#v}" >> "$GITHUB_OUTPUT"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/release.sh "$version"
          cd dist/releases
          sha256sum -c SHA256SUMS
      - name: Upload build artifacts for review
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # main, verified 2026-10-27
        with:
          name: healthbank-${{ inputs.version || github.ref_name }}
          path: |
            dist/releases/${{ steps.package.outputs.archive_prefix }}_linux_amd64.tar.gz
            dist/releases/${{ steps.package.outputs.archive_prefix }}_linux_arm64.tar.gz
            dist/releases/${{ steps.package.outputs.archive_prefix }}_source.tar.gz
            dist/releases/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Preserve existing Release or prepare a draft for a pushed tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -W error scripts/publish_release.py "$RELEASE_VERSION" "$GITHUB_SHA" tag

      - name: Publish candidate only after all release gates pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -W error scripts/publish_release.py "$RELEASE_VERSION" "$GITHUB_SHA" candidate
