name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      GOTOOLCHAIN: local
      GOENV: "off"
      GOWORK: "off"
      GOROOT: ""
      # Disposable CI-only credentials; no production or medical data is used.
      HEALTHBANK_TEST_MYSQL_DSN: healthbank_ci:healthbank-test-only@tcp(127.0.0.1:3306)/healthbank_test?parseTime=true
    services:
      mysql:
        image: mysql:26.10.0@sha256:f51c9c01c16b0eb5d81bb70ab7e7fcb3b96abc6a54114be3a94e8e569cae7815
        env:
          MYSQL_DATABASE: healthbank_test
          MYSQL_USER: healthbank_ci
          MYSQL_PASSWORD: healthbank-test-only
          MYSQL_ROOT_PASSWORD: healthbank-root-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=healthbank-root-test-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main, verified 2026-10-27
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # main, verified 2026-10-27
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build pinned upstream tools and React packages
        run: |
          bash scripts/bootstrap-upstream.sh
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/go/bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Require zero ESLint errors and warnings
        run: npm --prefix web run lint
      - name: Type-check and compile frontend
        run: npm --prefix web run build
      - name: Verify frontend data handling
        run: npm --prefix web test
      - name: Verify release layout and private-file exclusions
        run: |
          python3 -W error scripts/test_release.py
          python3 -W error scripts/test_publish_release.py
          python3 -W error scripts/test_provider_contracts.py
          python3 -W error scripts/check_provider_contracts.py
      - name: Check npm dependency advisories
        run: npm --prefix web audit --audit-level=low
      - name: Verify Go formatting and module checksums
        run: |
          unformatted="$(.tools/go/bin/gofmt -l cmd internal)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          .tools/go/bin/go mod verify
      - name: Run Go tests
        run: .tools/go/bin/go test -count=1 ./...
      - name: Detect Go data races
        run: .tools/go/bin/go test -count=1 -race ./...
      - name: Run Go vet
        run: .tools/go/bin/go vet ./...
      - name: Require all Staticcheck analyses to pass
        run: .tools/bin/staticcheck -checks=all ./cmd/... ./internal/...
      - name: Check reachable Go dependency advisories
        # Development Go lacks a comparable standard-library semver; see DEPENDENCIES.md.
        run: .tools/bin/govulncheck ./...
      - name: Compile Linux targets
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          GOARCH=amd64 .tools/go/bin/go build -trimpath -buildvcs=false -o /tmp/healthbank-amd64 ./cmd/healthbank
          GOARCH=arm64 .tools/go/bin/go build -trimpath -buildvcs=false -o /tmp/healthbank-arm64 ./cmd/healthbank
      - name: Install pinned test-only browser and Chinese font
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils unzip curl
          node scripts/browser-acceptance.mjs --setup --with-deps
          pdftotext -v
          pdfinfo -v
      - name: Verify compiled application in a real browser
        run: node scripts/browser-acceptance.mjs --binary /tmp/healthbank-amd64 --evidence "$RUNNER_TEMP/healthbank-browser-evidence"
      - name: Retain synthetic browser and PDF evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # main, verified 2026-10-27
        with:
          name: healthbank-synthetic-browser-ci
          path: |
            ${{ runner.temp }}/healthbank-browser-evidence/summary.json
            ${{ runner.temp }}/healthbank-browser-evidence/**/*.png
            ${{ runner.temp }}/healthbank-browser-evidence/**/*.pdf
          if-no-files-found: ignore
          retention-days: 7
