name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main, pinned 2026-10-26
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # main, pinned 2026-10-26
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build pinned upstream tools and React packages
        run: bash scripts/bootstrap-upstream.sh
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Type-check and compile frontend
        run: npm --prefix web run build
      - name: Run Go tests
        run: .tools/go/bin/go test ./...
      - name: Run Go vet
        run: .tools/go/bin/go vet ./...
      - name: Compile Linux targets
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          GOARCH=amd64 .tools/go/bin/go build -trimpath -buildvcs=false -o /tmp/healthbank-amd64 ./cmd/healthbank
          GOARCH=arm64 .tools/go/bin/go build -trimpath -buildvcs=false -o /tmp/healthbank-arm64 ./cmd/healthbank
