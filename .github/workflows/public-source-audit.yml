# Temporary public-source research; remove before integration.
name: Public source verification
on:
  push:
    branches: ["work/privacy-comparison-20261027"]
    paths: [".github/workflows/public-source-audit.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Read explicit public scripts and upstream references
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import datetime,hashlib,json,os,pathlib,subprocess,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'public-research';out.mkdir()
          scripts=['IHKE3301S01.531b684d.js','IHKE3301S02.216e1ca5.js','IHKE3302S01.763402d6.js','IHKE3303S01.3d574db2.js','IHKE3402S01.483e0f82.js','IHKE3403S01.34e867bc.js','IHKE3404S01.721fbd3e.js','IHKE3404S02.6d465ff6.js','IHKE3405S01.eaad4192.js','IHKE3115S01.be579f6a.js','IHKE3800download.562f3661.js']
          # Every script except the download module is from the supplied webpack manifest.
          # Do not guess the download hash: omit it until independently recovered.
          scripts=scripts[:-1]
          results=[]
          for name in scripts:
              url='https://myhealthbank.nhi.gov.tw/IHKE3000/js/'+name
              row={'url':url}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Healthbank public source review','Accept':'application/javascript'}),timeout=20) as response:
                      body=response.read(2*1024*1024+1);row['status']=response.status;row['content_type']=response.headers.get('Content-Type','')
                  if len(body)>2*1024*1024: raise ValueError('public script exceeds size limit')
                  if b'webpackJsonp' not in body: raise ValueError('response is not the expected public webpack bundle')
                  (out/name).write_bytes(body);row['sha256']=hashlib.sha256(body).hexdigest()
              except Exception as exc: row['error']=str(exc)
              results.append(row)
          lock=json.loads(pathlib.Path('dependencies.lock.json').read_text());upstream=[]
          for source in lock['sources']:
              repo=source['repository'];row={'name':source['name'],'repository':repo,'locked':source['commit']}
              try:
                  if repo.startswith('https://github.com/'):
                      name=repo.removeprefix('https://github.com/')
                      meta=json.loads(subprocess.check_output(['gh','api','repos/'+name],timeout=30))
                      branch=meta['default_branch'];ref=json.loads(subprocess.check_output(['gh','api','repos/'+name+'/git/ref/heads/'+branch],timeout=30))
                      row.update(branch=branch,head=ref['object']['sha'])
                  else:
                      text=subprocess.check_output(['git','ls-remote',repo,'HEAD'],timeout=30,text=True)
                      row['head']=text.split()[0]
              except Exception as exc:row['error']=str(exc)
              upstream.append(row)
          (out/'evidence.json').write_text(json.dumps({'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scripts':results,'upstream':upstream},indent=2))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: healthbank-public-source-audit
          path: ${{ runner.temp }}/public-research/*
          retention-days: 1
          if-no-files-found: error
