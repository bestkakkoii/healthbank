# Temporary source transport; remove before integration.
name: Apply repair source
on:
  push:
    branches: [work/charts-medical-export]
    paths: ['.repair/*.py']
permissions:
  contents: write
concurrency:
  group: repair-integration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 2
      - name: Apply reviewed source transformation
        shell: python
        run: |
          import pathlib, subprocess
          changed=subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).splitlines()
          scripts=[p for p in changed if p.startswith('.repair/') and p.endswith('.py')]
          if len(scripts)!=1: raise ValueError('Expected exactly one reviewed transformation')
          subprocess.run(['python3',scripts[0]],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','web','internal','docs','scripts','README.md','CHANGELOG.md'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          title=pathlib.Path(scripts[0]).read_text().splitlines()[0].removeprefix('# ')
          subprocess.run(['git','commit','-m',title],check=True)
          subprocess.run(['git','push','origin','HEAD:work/charts-medical-export'],check=True)
