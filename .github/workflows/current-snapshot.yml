# Temporary full head snapshot for final release audit; remove before integration.
name: Current repair snapshot
on:
  push:
    branches: [work/charts-medical-export]
    paths: [.github/workflows/current-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Export source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/current"
          git archive HEAD | gzip -n > "$RUNNER_TEMP/current/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/current/COMMIT"
          (cd "$RUNNER_TEMP/current" && sha256sum source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: healthbank-current-branch-source
          path: ${{ runner.temp }}/current/*
          if-no-files-found: error
          retention-days: 2
