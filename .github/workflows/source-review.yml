# Temporary isolated review transport; removed before integration.
name: Source review snapshot
on:
  push:
    branches: ["work/privacy-comparison-20261027"]
    paths: [".github/workflows/source-review.yml"]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Build verified runtime sources
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap-upstream.sh
          export JAVA_HOME="${JAVA_HOME_21_X64:?Runner must provide the Closure-compatible Java 21 toolchain}"
          export PATH="$GITHUB_WORKSPACE/.tools/bin:$GITHUB_WORKSPACE/.tools/go/bin:$JAVA_HOME/bin:$PATH"
          export GOENV=off GOWORK=off GOTOOLCHAIN=local
          java --version
          revision=e9df86ca6991b779ee50bc744ad8bbdeefa9bae6
          curl --fail --location --connect-timeout 20 --max-time 180 "https://codeload.github.com/facebook/react/tar.gz/$revision" -o "$RUNNER_TEMP/react.tar.gz"
          tar -xzf "$RUNNER_TEMP/react.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/react-$revision"
          npm exec --yes --package=yarn@1.22.22 -- yarn install --frozen-lockfile --non-interactive
          node scripts/rollup/build.js react/index,react/jsx,react-dom/index,react-dom/client,scheduler --type=NODE_DEV,NODE_PROD
          cd "$GITHUB_WORKSPACE"
          go get github.com/go-sql-driver/mysql@c9e0863414a0e47bd708fcbc93d4adc611d15a5e
          go mod tidy
          python3 scripts/review-runtime.py
          go mod vendor
          npm --prefix web ci
          npm --prefix web audit --audit-level=low
      - name: Export immutable upgrade inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-upgrade"
          tar -czf "$RUNNER_TEMP/runtime-upgrade/runtime-upgrade.tar.gz" web/vendor/react-main.tgz web/vendor/react-dom-main.tgz web/vendor/scheduler-main.tgz web/package-lock.json web/node_modules go.mod go.sum vendor dependencies.lock.json scripts/bootstrap-upstream.sh
          cd "$RUNNER_TEMP/runtime-upgrade"
          sha256sum runtime-upgrade.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: healthbank-runtime-upgrade
          path: ${{ runner.temp }}/runtime-upgrade/*
          if-no-files-found: error
          retention-days: 1
