# Temporary branch-only transfer. Removed before the feature PR is reviewed.
name: Integrate verified review changes
on:
  push:
    branches: ["work/privacy-comparison-20261027"]
    paths: [".github/workflows/source-review.yml", ".github/review-transfer/**"]
permissions:
  contents: write
  actions: read
concurrency:
  group: healthbank-review-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Apply exact locally verified text snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/review-transfer/apply.py
      - name: Restore source-built runtime packages from the verified repository artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-input"
          gh run download 40475265417 --name healthbank-runtime-upgrade --dir "$RUNNER_TEMP/runtime-input"
          (cd "$RUNNER_TEMP/runtime-input" && printf '%s\n' '5865f3446041614b10e0b66285d8c8a5a21ebaabef4626160c20169106c81ef7  runtime-upgrade.tar.gz' | sha256sum --check -)
          tar -xzf "$RUNNER_TEMP/runtime-input/runtime-upgrade.tar.gz" web/vendor/react-main.tgz web/vendor/react-dom-main.tgz web/vendor/scheduler-main.tgz
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path.cwd()
          lock=json.loads((root/'dependencies.lock.json').read_text())
          for name in ['react-main.tgz','react-dom-main.tgz','scheduler-main.tgz']:
              digest=hashlib.sha256((root/'web/vendor'/name).read_bytes()).hexdigest()
              if digest != lock['vendored_packages'][name]:
                  raise RuntimeError('Pinned runtime package mismatch: '+name)
              print('Verified runtime package:',name,digest)
          PY
      - name: Commit only to the existing work branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'work/privacy-comparison-20261027'
          git rm -r -- .github/review-transfer
          git rm --ignore-unmatch -- scripts/review-runtime.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add verified age-sex scenarios and private-device login profiles' -m 'Preserve source observations, enforce conditional equations, improve no-store headers, and document settings-only server persistence. Local verification and explicit outstanding acceptance are recorded in docs/verification.zh-TW.md. No production deployment or release.'
          gh auth setup-git
          git push origin HEAD:refs/heads/work/privacy-comparison-20261027
          printf 'Integrated commit: %s\n' "$(git rev-parse HEAD)"
