# Temporary review-branch tooling; removed before integration.
name: Source review snapshot
on:
  push:
    branches: ["work/privacy-comparison-20261027"]
    paths: [".github/workflows/source-review.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Prepare pinned tools and dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bootstrap-upstream.sh
          export PATH="$GITHUB_WORKSPACE/.tools/bin:$GITHUB_WORKSPACE/.tools/go/bin:$PATH"
          export GOENV=off GOWORK=off GOTOOLCHAIN=local
          npm --prefix web ci
          go mod vendor
      - name: Audit upstream heads without changing pins
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, json, pathlib, subprocess
          lock=json.loads(pathlib.Path('dependencies.lock.json').read_text())
          def inspect(source):
              run=subprocess.run(['git','ls-remote','--symref',source['repository'],'HEAD'],capture_output=True,text=True,timeout=60)
              return {'name':source['name'],'repository':source['repository'],'pinned':source['commit'],'exit_code':run.returncode,'response':run.stdout,'error':run.stderr}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(inspect,lock['sources']))
          pathlib.Path('upstream-heads.json').write_text(json.dumps({'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sources':results},indent=2))
          PY
      - name: Export review tools without credentials or patient data
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/healthbank-review"
          mkdir -p "$target"
          python3 - <<'PY'
          import os,pathlib,shutil
          root=pathlib.Path('.tools').resolve()
          for name in ['node','npm','npx','tsc','esbuild','govulncheck']:
              p=root/'bin'/name
              resolved=p.resolve()
              p.unlink()
              p.symlink_to(os.path.relpath(resolved,p.parent))
          p=root/'go'
          resolved=p.resolve()
          p.unlink()
          p.symlink_to(os.path.relpath(resolved,p.parent))
          PY
          tar -czf "$target/verification-tools.tar.gz" .tools/bin .tools/go .tools/toolchains .tools/tsc.revision .tools/esbuild.revision web/node_modules vendor upstream-heads.json
          git rev-parse HEAD > "$target/COMMIT"
          cd "$target"
          sha256sum verification-tools.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: healthbank-verification-tools
          path: ${{ runner.temp }}/healthbank-review/*
          if-no-files-found: error
          retention-days: 1
