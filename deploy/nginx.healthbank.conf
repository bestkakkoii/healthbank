# Optional application-only location snippet for any Nginx HTTPS server block.
# Preserve site name, certificates and ACME configuration. Do not duplicate location /.
# No web root is needed: frontend assets are embedded in the Go executable.
# Operator readiness/capacity details are available only at the local listener.
location = /api/ready {
    return 404;
    access_log off;
}
location / {
    # 32 MiB portable JSON/XML plus the Go handler's 64 KiB multipart allowance.
    client_max_body_size 32832k;
    # Fit the maximum accepted upload envelope in memory. Bound total concurrent
    # requests at the deployment boundary according to available RAM.
    client_body_buffer_size 33m;
    client_body_in_file_only off;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_store off;
    access_log off;
    # Keep actionable error logs; do not enable debug/body/header capture.
    # CDN/WAF logging, OS swap/core dumps and backups require a separate audit.
}
