# Optional BaoTa site-level location snippet for Healthbank v1.
# Paste inside THIS APP's server {} block only, replacing its existing location /.
# Do not paste into nginx.conf's http {} block and do not add a second location /.
# Keep domain, listen, SSL certificates and ACME validation under BaoTa management.
# BaoTa's existing Go-project mapping can be used instead of this snippet.

location / {
    # Allows a 12 MiB file plus its multipart envelope; the app enforces file size.
    client_max_body_size 13m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;
    proxy_buffering off;
    proxy_request_buffering off;

    # Configuration and clinical data responses must not enter a reverse-proxy cache.
    proxy_cache off;
    # Keep query dates out of this app's access logs.
    access_log off;
}

# Optional minimal health check URL: /api/health
# The app serves its compiled frontend itself; no separate root/alias is required.
